name: Secrets

on:
  workflow_dispatch:

jobs:
  print:
    runs-on: ubuntu-latest

    env:
      PASSWORD: ${{ secrets.PASSWORD }}

    steps:
      - name: Check secret
        run: |
          if [ -n "$PASSWORD" ]; then
            echo "Secret is configured"
          else
            echo "Secret is missing"
            exit 1
          fi

      - name: Verify secret masking
        run: |
          echo "$PASSWORD"
