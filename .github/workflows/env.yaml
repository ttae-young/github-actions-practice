name: Environment Variables

on:
  workflow_dispatch:

jobs:
  environment:
    runs-on: ubuntu-latest

    env:
      APP_NAME: MyPythonApp
      PYTHON_VERSION: '3.12'
      TEST_MODE: development
      ACTOR: ${{ github.actor }}

    steps:
      - name: Print Environment
        run: |
          echo "Application: $APP_NAME"
          echo "Python: $PYTHON_VERSION"
          echo "Mode: $TEST_MODE"
          echo "Actor: $ACTOR"

      - name: Check Test Mode
        if: env.TEST_MODE == 'development'
        run: echo "Development mode enabled"

      - name: Context Environment
        run: echo "$ACTOR"
